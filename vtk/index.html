<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" type="text/css" href="../assets/css/index.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <div class="title-bar">
    VTK
    </div>
    <div id="rectangle">
      <a href="../../shouye.html"><img src="../assets/images/fanhui.png" alt="返回" title="返回主页面"></a>
      <img id="icon" src="../assets/images/wenjianjia.png" alt="Icon 1" title="打开文件夹">
      <img id='pick' src="../assets/images/img_3.png" alt="Icon 4" title="选点">
      <div id="pick-sidebar">
        <div class="sidebar-title">选点工具</div>
        <button class="sidebar-btn" id="btn-pick-mode">选点</button>
        <button class="sidebar-btn" id="btn-generate">生成</button>
        <button class="sidebar-btn" id="btn-clear-points">清除</button>
      </div>
      <div id="customMenu1">
        <div id="clear1">清点</div>
      </div>
      <img id="daoru" src="../assets/images/img_4.png" alt="Icon 5" title="导入模型">
      <div id="import-sidebar">
        <div class="sidebar-title">导入模型</div>
        <button class="sidebar-btn" id="btn-import-nail">导入钉子</button>
        <button class="sidebar-btn" id="btn-import-guide">导入导板</button>
        <button class="sidebar-btn" id="btn-import-base">导入基座</button>
      </div>
      <img id="distance" src="../assets/images/img_5.png" alt="Icon 6" title="测距">
      <div id="customMenu">
        <div id="clear">清点</div>
      </div>
      <img id="opacityBtn" src="../assets/images/img_7.png" alt="Icon 7" title="透明度切换">
    </div>
    <div id="bottomRectangle">
    </div>
    <div id="new-div">
      <div class="titlebar">参数</div>
      <div class="datafont"><span class="datatext">入钉长度:</span><div class="data-box1"></div></div>
      <div class="datafont"><span class="datatext">上下倾角:</span><div class="data-box2"></div></div>
      <div class="datafont"><span class="datatext">左右倾角:</span><div class="data-box3"></div></div>
      <div class="datafont"><span class="datatext">两点距离:</span><div class="data-box4"></div></div>
      <div class="bottombar">
        规划
      </div>
      <div id="checkbox-container">
        <label>
          <input type="checkbox" id="checkbox1" onchange="checkboxClicked(this)">
          <span class="custom-checkbox">显示钉子</span>
        </label>
        <label>
          <input type="checkbox" id="checkbox2" onchange="checkboxClicked1(this)">
          <span class="custom-checkbox">显示导板</span>
        </label>
        <label>
          <input type="checkbox" id="checkbox3" onchange="checkboxClicked2(this)">
          <span class="custom-checkbox">显示基座</span>
        </label>
      </div>
    </div>
    <script type="module" src="./index.js"></script>
    <script type="text/javascript" src="https://unpkg.com/@babel/polyfill@7.12.1/dist/polyfill.js"></script>
    <script type="text/javascript" src="https://unpkg.com/vtk.js@30.3.1/vtk.js"></script>
    <script type="text/javascript">
      // ============ 右键菜单逻辑 ============
      function setupContextMenu(triggerId, menuId) {
        document.getElementById(triggerId).addEventListener("contextmenu", function(event) {
          event.preventDefault();
          var menu = document.getElementById(menuId);
          menu.style.display = "block";
          menu.style.left = event.pageX + "px";
          menu.style.top = event.pageY - 55 + "px";
        });
      }
      setupContextMenu("distance", "customMenu");
      setupContextMenu("pick", "customMenu1");

      // 点击其他地方关闭所有菜单
      document.addEventListener("click", function(event) {
        ["customMenu", "customMenu1"].forEach(function(menuId) {
          var menu = document.getElementById(menuId);
          if (menu && !event.target.closest("#" + menuId)) {
            menu.style.display = "none";
          }
        });
      });

      // ============ VTK 初始化 ============
      const container = document.getElementById('bottomRectangle');
      var fullScreenRenderer = vtk.Rendering.Misc.vtkFullScreenRenderWindow.newInstance({ 
        rootContainer: container,
        background: [0, 0, 0]
      });
      var renderWindow = fullScreenRenderer.getRenderWindow();
      var renderer = fullScreenRenderer.getRenderer();
      
      const canvas = container.querySelector('canvas');
      if (canvas) {
        canvas.style.width = '100%';
        canvas.style.height = '100%';
        canvas.style.display = 'block';
      }
      var picker = vtk.Rendering.Core.vtkPointPicker.newInstance();

      picker.setPickFromList(1);
      picker.initializePickList();

      // ============ 模型管理器 ============
      class ModelManager {
        constructor() {
          this.models = {};
          this.actors = {};
          this.mappers = {};
          this.isLoading = false;
        }

        async loadModel(name, url, visible = false) {
          // 检查是否已加载
          if (this.models[name]) {
            if (visible) {
              this.showModel(name);
            }
            return this.models[name].actor;
          }

          if (this.isLoading) {
            showStatus('正在加载中，请稍候...');
            return null;
          }

          this.isLoading = true;

          try {
            // 通过主进程直接读取文件（比fetch更快）
            let arrayBuffer;
            if (window.electronapi && window.electronapi.readStlFile) {
              arrayBuffer = await window.electronapi.readStlFile(url);
            } else {
              const response = await fetch(url);
              arrayBuffer = await response.arrayBuffer();
            }

            const reader = vtk.IO.Geometry.vtkSTLReader.newInstance();
            reader.parseAsArrayBuffer(arrayBuffer);
            const data = reader.getOutputData();

            const mapper = vtk.Rendering.Core.vtkMapper.newInstance();
            mapper.setInputData(data);

            const actor = vtk.Rendering.Core.vtkActor.newInstance();
            actor.setMapper(mapper);

            this.models[name] = { actor, mapper, data, url };
            this.actors[name] = actor;
            this.mappers[name] = mapper;

            const numPts = data.getNumberOfPoints ? data.getNumberOfPoints() : 0;
            const bounds = data.getBounds ? data.getBounds() : [];
            console.log(`[模型加载] ${name} 点数:${numPts} bounds:[${bounds.map(v=>v.toFixed(2)).join(', ')}]`);

            if (visible) {
              renderer.addActor(actor);
              picker.addPickList(actor);
              renderer.resetCamera();
              renderWindow.render();
            }

            showStatus(`已加载: ${name}`);
            return actor;
          } catch (error) {
            console.error(`加载模型 ${name} 失败:`, error);
            showStatus(`加载失败: ${name}`);
            return null;
          } finally {
            this.isLoading = false;
          }
        }

        showModel(name) {
          const model = this.models[name];
          if (model) {
            renderer.addActor(model.actor);
            picker.addPickList(model.actor);
            renderWindow.render();
          }
        }

        hideModel(name) {
          const model = this.models[name];
          if (model) {
            renderer.removeActor(model.actor);
            renderWindow.render();
          }
        }

        resetCamera() {
          renderer.resetCamera();
          renderWindow.render();
        }

        setOpacity(name, opacity) {
          const model = this.models[name];
          if (model && model.actor) {
            model.actor.getProperty().setOpacity(opacity);
            renderWindow.render();
          }
        }

        setAllOpacity(opacity) {
          Object.keys(this.models).forEach(name => {
            this.setOpacity(name, opacity);
          });
        }
      }

      const modelManager = new ModelManager();

      // ============ 文件加载 ============
      document.getElementById("icon").addEventListener("click", async function() {
        try {
          const result = await window.electronapi.openStlFile();
          if (!result.canceled && result.filePaths.length > 0) {
            const filePath = result.filePaths[0];
            const fileName = filePath.split('\\').pop().split('/').pop();
            const modelName = fileName.replace('.stl', '');

            if (result.fileData) {
              const reader = vtk.IO.Geometry.vtkSTLReader.newInstance();
              reader.parseAsArrayBuffer(result.fileData);
              const data = reader.getOutputData();

              const mapper = vtk.Rendering.Core.vtkMapper.newInstance();
              mapper.setInputData(data);

              const actor = vtk.Rendering.Core.vtkActor.newInstance();
              actor.setMapper(mapper);

              modelManager.models[modelName] = { actor, mapper, data, url: filePath };
              modelManager.actors[modelName] = actor;
              modelManager.mappers[modelName] = mapper;

              renderer.addActor(actor);
              picker.addPickList(actor);
              renderer.resetCamera();
              renderWindow.render();

              showStatus(`已加载: ${fileName}`);
            }
          }
        } catch (error) {
          console.error('打开文件失败:', error);
          showStatus('打开文件失败');
        }
      });

      // ============ 导入模型侧边栏 ============
      const importSidebar = document.getElementById("import-sidebar");
      const daoruBtn = document.getElementById("daoru");
      let importSidebarTimer = null;

      // 点击导入按钮显示侧边栏
      daoruBtn.addEventListener("click", function() {
        clearTimeout(importSidebarTimer);
        const rect = daoruBtn.getBoundingClientRect();
        importSidebar.style.top = rect.top + "px";
        importSidebar.style.left = (rect.right + 5) + "px";
        importSidebar.style.display = "flex";
      });

      // 鼠标进入侧边栏时取消隐藏定时器
      importSidebar.addEventListener("mouseenter", function() {
        clearTimeout(importSidebarTimer);
      });

      // 鼠标离开侧边栏时延迟隐藏
      importSidebar.addEventListener("mouseleave", function() {
        importSidebarTimer = setTimeout(function() {
          importSidebar.style.display = "none";
        }, 300);
      });

      // 鼠标离开导入按钮时延迟隐藏
      daoruBtn.addEventListener("mouseleave", function() {
        importSidebarTimer = setTimeout(function() {
          importSidebar.style.display = "none";
        }, 300);
      });

      // 导入钉子
      document.getElementById("btn-import-nail").addEventListener("click", async function() {
        importSidebar.style.display = "none";
        await importModel('nail', '钉子');
      });

      // 导入导板（同时导入handle）
      document.getElementById("btn-import-guide").addEventListener("click", async function() {
        importSidebar.style.display = "none";
        await importGuideWithHandle();
      });

      // 导入基座
      document.getElementById("btn-import-base").addEventListener("click", async function() {
        importSidebar.style.display = "none";
        await importModel('jizuo', '基座');
      });

      // 导入导板+手柄
      async function importGuideWithHandle() {
        try {
          const result = await window.electronapi.openStlFile();
          if (!result.canceled && result.filePaths.length > 0) {
            const filePath = result.filePaths[0];
            const dirPath = filePath.substring(0, filePath.lastIndexOf('\\'));
            
            // 加载导板
            await modelManager.loadModel('guide', filePath, true);
            
            // 尝试加载同目录下的handle.stl
            const handlePath = dirPath + '\\handle.stl';
            try {
              await modelManager.loadModel('handle', handlePath, true);
            } catch (e) {
              console.log('handle.stl不存在或加载失败');
            }
            
            modelManager.resetCamera();
            
            // 显示右侧参数面板
            container.style.right = '30%';
            document.getElementById('new-div').style.display = 'flex';
            
            // 勾选导板复选框
            document.getElementById('checkbox2').checked = true;
            
            // 尝试读取配置文件显示参数
            try {
              const config = await window.electronapi.readConfig(dirPath);
              console.log('读取配置文件:', config);
              if (config && config.location1) {
                // 参考QT版本：location[0]=入钉长度, location[2][0]=上下倾角, location[2][1]=左右倾角
                document.querySelector('.data-box1').textContent = parseFloat(config.location1).toFixed(2);
                document.querySelector('.data-box2').textContent = parseFloat(config.location2).toFixed(2);
                document.querySelector('.data-box3').textContent = parseFloat(config.location3).toFixed(2);
              }
            } catch (e) {
              console.error('读取配置文件失败:', e);
            }
            
            showStatus('已导入: 导板+手柄');
          }
        } catch (error) {
          console.error('导入导板失败:', error);
          showStatus('导入导板失败');
        }
      }

      // 导入模型通用函数
      async function importModel(defaultName, title) {
        try {
          const result = await window.electronapi.openStlFile();
          if (!result.canceled && result.filePaths.length > 0) {
            const filePath = result.filePaths[0];
            const dirPath = filePath.substring(0, filePath.lastIndexOf('\\'));
            
            await modelManager.loadModel(defaultName, filePath, true);
            modelManager.resetCamera();
            
            // 显示右侧参数面板
            container.style.right = '30%';
            document.getElementById('new-div').style.display = 'flex';
            
            // 勾选对应的复选框
            if (defaultName === 'nail') {
              document.getElementById('checkbox1').checked = true;
            } else if (defaultName === 'guide') {
              document.getElementById('checkbox2').checked = true;
            } else if (defaultName === 'jizuo') {
              document.getElementById('checkbox3').checked = true;
            }
            
            // 尝试读取配置文件显示参数
            try {
              const config = await window.electronapi.readConfig(dirPath);
              console.log('读取配置文件:', config);
              if (config && config.location1) {
                // 参考QT版本：location[0]=入钉长度, location[2][0]=上下倾角, location[2][1]=左右倾角
                document.querySelector('.data-box1').textContent = parseFloat(config.location1).toFixed(2);
                document.querySelector('.data-box2').textContent = parseFloat(config.location2).toFixed(2);
                document.querySelector('.data-box3').textContent = parseFloat(config.location3).toFixed(2);
                showStatus(`已导入: ${title} (含参数)`);
              } else {
                showStatus(`已导入: ${title} (无参数文件)`);
              }
            } catch (e) {
              console.error('读取配置文件失败:', e);
              showStatus(`已导入: ${title}`);
            }
          }
        } catch (error) {
          console.error(`导入${title}失败:`, error);
          showStatus(`导入${title}失败`);
        }
      }

      // ============ 复选框控制 ============
      window.checkboxClicked = function(checkbox) {
        if (checkbox.checked) {
          modelManager.showModel('nail');
        } else {
          modelManager.hideModel('nail');
        }
      };
      window.checkboxClicked1 = function(checkbox) {
        if (checkbox.checked) {
          modelManager.showModel('guide');
          modelManager.showModel('handle');
        } else {
          modelManager.hideModel('guide');
          modelManager.hideModel('handle');
        }
      };
      window.checkboxClicked2 = function(checkbox) {
        if (checkbox.checked) {
          modelManager.showModel('jizuo');
        } else {
          modelManager.hideModel('jizuo');
        }
      };

      // ============ 透明度切换 ============
      let isTransparent = false;
      const opacityBtn = document.getElementById('opacityBtn');
      
      opacityBtn.addEventListener('click', function() {
        isTransparent = !isTransparent;
        const opacity = isTransparent ? 0.3 : 1.0;
        modelManager.setAllOpacity(opacity);
        opacityBtn.style.filter = isTransparent ? 'brightness(0.5)' : 'brightness(1)';
        showStatus(isTransparent ? '透明度: 30%' : '透明度: 100%');
      });

      // ============ 取点功能 ============
      class PointPicker {
        constructor() {
          this.points = [];
          this.actors = [];
          this.isActive = false;
          this.maxPoints = 3;
          this.interactorUnsubscribe = null;
        }

        isModelActor(actor) {
          return Object.values(modelManager.models).some(m => m.actor === actor);
        }

        activate() {
          if (this.isActive) return;
          this.isActive = true;
          this.points = [];
          this.clearActors();

          const subscription = renderWindow.getInteractor().onRightButtonPress((callData) => {
            if (renderer !== callData.pokedRenderer) return;

            const pos = callData.position;
            const point = [pos.x, pos.y, 0.0];
            picker.pick(point, renderer);

            const actors = picker.getActors();
            const pickedPoints = picker.getPickedPositions();
            console.log('[取点调试] 屏幕:', pos.x, pos.y, '命中actor:', actors.length, 'pickedPositions:', pickedPoints.length);
            actors.forEach((a, i) => console.log('[取点调试] actor['+i+'] isModel=' + this.isModelActor(a)));
            if (pickedPoints.length) {
              const p = pickedPoints[0];
              console.log('[取点调试] 坐标:', p[0].toFixed(4), p[1].toFixed(4), p[2].toFixed(4));
              // 打印模型bounds对比
              const modelNames = Object.keys(modelManager.models);
              if (modelNames.length) {
                const mData = modelManager.models[modelNames[0]].data;
                const bounds = mData.getBounds();
                console.log('[取点调试] 模型bounds:', bounds.map(v=>v.toFixed(2)).join(', '));
              }
            }

            if (actors.length === 0) return;

            const pickedActor = actors[0];
            if (!this.isModelActor(pickedActor)) {
              console.warn('[取点调试] 非STL模型actor，已忽略');
              return;
            }

            if (pickedPoints.length === 0) return;

            const pickedPoint = pickedPoints[0];
            this.addPoint(pickedPoint);
          });
          
          this.subscription = subscription;

          showStatus('取点模式已激活，左键点击选择3个点');
        }

        deactivate() {
          this.isActive = false;
          if (this.subscription) {
            this.subscription.unsubscribe();
            this.subscription = null;
          }
        }

        addPoint(point) {
          if (this.points.length >= this.maxPoints) {
            // 替换最早的点
            this.points.shift();
            renderer.removeActor(this.actors.shift());
          }

          this.points.push(point);
          const actor = this.createSphereActor(point, [0, 1, 0]);
          this.actors.push(actor);
          renderer.addActor(actor);
          renderWindow.render();

          // 输出点坐标到控制台
          console.log(`[取点] 第${this.points.length}个点: x=${point[0].toFixed(4)}, y=${point[1].toFixed(4)}, z=${point[2].toFixed(4)}`);
          console.log(`[取点] 当前所有点:`, JSON.stringify(this.points.map(p => [p[0].toFixed(4), p[1].toFixed(4), p[2].toFixed(4)])));

          // 更新状态显示
          updatePointInfo();

          showStatus(`已选择 ${this.points.length}/${this.maxPoints} 个点`);

          // 取满3个点后自动退出选点模式
          if (this.points.length >= this.maxPoints) {
            this.deactivate();
            document.getElementById("btn-pick-mode").classList.remove("active");
            showStatus('已取满3个点，可以点击生成');
          }
        }

        createSphereActor(center, color, radius = 3) {
          const sphereSource = vtk.Filters.Sources.vtkSphereSource.newInstance();
          sphereSource.setCenter(center);
          sphereSource.setRadius(radius);
          const mapper = vtk.Rendering.Core.vtkMapper.newInstance();
          mapper.setInputData(sphereSource.getOutputData());
          const actor = vtk.Rendering.Core.vtkActor.newInstance();
          actor.setMapper(mapper);
          actor.getProperty().setColor(color[0], color[1], color[2]);
          return actor;
        }

        async generate() {
          if (this.points.length < this.maxPoints) {
            alert('取点错误无法生成');
            showStatus('取点错误无法生成');
            return;
          }

          const array = this.points.map(p => [p[0], p[1], p[2]]);
          showStatus('正在生成模型...');

          try {
            // 获取用户加载的模型文件路径（优先使用骨骼模型）
            let modelPath = '';
            const boneNames = ['scapula', 'Scapula', 'humerus', 'Humerus', 'mesh'];
            for (const name of boneNames) {
              if (modelManager.models[name]) {
                modelPath = modelManager.models[name].url;
                break;
              }
            }
            if (!modelPath && Object.keys(modelManager.models).length > 0) {
              const firstModelName = Object.keys(modelManager.models)[0];
              modelPath = modelManager.models[firstModelName].url;
            }
            console.log('[生成] 使用模型路径:', modelPath);
            
            const result = await window.electronapi.path(array, modelPath);
            if (result) {
              const lines = result.split('\n');
              if (lines.length >= 3) {
                // 参考QT版本显示逻辑：location[0], location[2][0], location[2][1]
                const nailLength = parseFloat(lines[0]).toFixed(2);  // 入钉长度
                const upDownAngle = parseFloat(lines[1]).toFixed(2);  // 上下倾角
                const leftRightAngle = parseFloat(lines[2]).toFixed(2);  // 左右倾角
                
                document.querySelector('.data-box1').textContent = nailLength;
                document.querySelector('.data-box2').textContent = upDownAngle;
                document.querySelector('.data-box3').textContent = leftRightAngle;
                
                // 获取保存路径（第四行）
                const savePath = lines.length >= 4 ? lines[3] : '未知路径';
                
                // 弹窗提示保存成功
                alert(`STL文件已保存至：\n${savePath}`);
                showStatus('模型生成完成');
              }
            }
          } catch (error) {
            console.error('生成失败:', error);
            showStatus('生成失败');
          }
        }

        clear() {
          this.deactivate();
          this.clearActors();
          this.points = [];
          this.isActive = false;
          renderWindow.render();
          showStatus('已清除取点');
        }

        clearActors() {
          this.actors.forEach(actor => {
            renderer.removeActor(actor);
          });
          this.actors = [];
        }
      }

      const pointPicker = new PointPicker();

      // 显示/隐藏侧边栏
      const pickSidebar = document.getElementById("pick-sidebar");
      const pickBtn = document.getElementById("pick");
      let sidebarTimer = null;

      // 点击选点按钮显示侧边栏
      pickBtn.addEventListener("click", function() {
        clearTimeout(sidebarTimer);
        const rect = pickBtn.getBoundingClientRect();
        pickSidebar.style.top = rect.top + "px";
        pickSidebar.style.left = (rect.right + 5) + "px";
        pickSidebar.style.display = "flex";
      });

      // 鼠标进入侧边栏时取消隐藏定时器
      pickSidebar.addEventListener("mouseenter", function() {
        clearTimeout(sidebarTimer);
      });

      // 鼠标离开侧边栏时延迟隐藏
      pickSidebar.addEventListener("mouseleave", function() {
        sidebarTimer = setTimeout(function() {
          pickSidebar.style.display = "none";
        }, 300);
      });

      // 鼠标离开选点按钮时延迟隐藏（如果没进入侧边栏）
      pickBtn.addEventListener("mouseleave", function() {
        sidebarTimer = setTimeout(function() {
          pickSidebar.style.display = "none";
        }, 300);
      });

      // 选点按钮
      document.getElementById("btn-pick-mode").addEventListener("click", function() {
        pointPicker.activate();
        document.getElementById("btn-pick-mode").classList.add("active");
        // 关闭侧边栏
        pickSidebar.style.display = "none";
      });

      // 生成按钮
      document.getElementById("btn-generate").addEventListener("click", function() {
        pointPicker.generate();
      });

      // 清除按钮
      document.getElementById("btn-clear-points").addEventListener("click", function() {
        pointPicker.clear();
        document.getElementById("btn-pick-mode").classList.remove("active");
        updatePointInfo();
      });

      // 清除取点（右键菜单）
      document.getElementById("clear1").addEventListener("click", function() {
        pointPicker.clear();
        document.getElementById("btn-pick-mode").classList.remove("active");
        updatePointInfo();
      });

      // ============ 测距功能 ============
      class DistanceMeasurer {
        constructor() {
          this.points = [];
          this.actors = [];
          this.lineActor = null;
          this.isActive = false;
        }

        activate() {
          if (this.isActive) return;
          this.isActive = true;
          this.points = [];
          this.clearActors();

          const subscription = renderWindow.getInteractor().onMiddleButtonPress((callData) => {
            if (renderer !== callData.pokedRenderer) return;
            if (this.points.length >= 2) return;

            const pos = callData.position;
            const point = [pos.x, pos.y, 0.0];
            picker.pick(point, renderer);

            if (picker.getActors().length === 0) return;

            const pickedActor = picker.getActors()[0];
            if (!pointPicker.isModelActor(pickedActor)) return;

            const pickedPoints = picker.getPickedPositions();
            if (pickedPoints.length === 0) return;

            this.addPoint(pickedPoints[0]);
          });
          
          this.subscription = subscription;

          showStatus('测距模式已激活，中键点击选择2个点');
        }

        deactivate() {
          this.isActive = false;
          if (this.subscription) {
            this.subscription.unsubscribe();
            this.subscription = null;
          }
        }

        addPoint(point) {
          if (this.points.length >= 2) {
            this.clearActors();
            this.points = [];
          }

          this.points.push(point);
          const actor = this.createSphereActor(point, [0, 1, 0]);
          this.actors.push(actor);
          renderer.addActor(actor);

          if (this.points.length === 2) {
            this.drawLine();
            const distance = this.calculateDistance(this.points[0], this.points[1]);
            document.querySelector('.data-box4').textContent = distance.toFixed(2);
            
            container.style.right = '30%';
            document.getElementById('new-div').style.display = 'flex';
          }

          renderWindow.render();
        }

        drawLine() {
          if (this.lineActor) {
            renderer.removeActor(this.lineActor);
          }

          const lineSource = vtk.Filters.Sources.vtkLineSource.newInstance();
          lineSource.setPoint1(this.points[0]);
          lineSource.setPoint2(this.points[1]);

          const mapper = vtk.Rendering.Core.vtkMapper.newInstance();
          mapper.setInputData(lineSource.getOutputData());

          this.lineActor = vtk.Rendering.Core.vtkActor.newInstance();
          this.lineActor.setMapper(mapper);
          this.lineActor.getProperty().setColor(0, 1, 0);
          this.lineActor.getProperty().setLineWidth(2);

          renderer.addActor(this.lineActor);
          this.actors.push(this.lineActor);
        }

        createSphereActor(center, color, radius = 2) {
          const sphereSource = vtk.Filters.Sources.vtkSphereSource.newInstance();
          sphereSource.setCenter(center);
          sphereSource.setRadius(radius);
          const mapper = vtk.Rendering.Core.vtkMapper.newInstance();
          mapper.setInputData(sphereSource.getOutputData());
          const actor = vtk.Rendering.Core.vtkActor.newInstance();
          actor.setMapper(mapper);
          actor.getProperty().setColor(color[0], color[1], color[2]);
          return actor;
        }

        calculateDistance(p1, p2) {
          const dx = p2[0] - p1[0];
          const dy = p2[1] - p1[1];
          const dz = p2[2] - p1[2];
          return Math.sqrt(dx * dx + dy * dy + dz * dz);
        }

        clear() {
          this.deactivate();
          this.clearActors();
          this.points = [];
          if (this.lineActor) {
            renderer.removeActor(this.lineActor);
            this.lineActor = null;
          }
          document.querySelector('.data-box4').textContent = '';
          renderWindow.render();
          showStatus('已清除测距');
        }

        clearActors() {
          this.actors.forEach(actor => {
            renderer.removeActor(actor);
          });
          this.actors = [];
        }
      }

      const distanceMeasurer = new DistanceMeasurer();

      // 激活测距模式
      document.getElementById("distance").addEventListener("click", function() {
        distanceMeasurer.activate();
      });

      // 清除测距
      document.getElementById("clear").addEventListener("click", function() {
        distanceMeasurer.clear();
      });

      // ============ 状态提示 ============
      function showStatus(message) {
        console.log('[状态]', message);
        // 可以在这里添加状态栏显示
      }

      // ============ 点信息显示 ============
      function updatePointInfo() {
        // Point data remains stored in pointPicker.points; UI rendering is disabled.
      }

      // ============ 初始化 ============
      renderer.setBackground(0, 0, 0);
      renderWindow.render();
    </script>
  </body>
</html>
