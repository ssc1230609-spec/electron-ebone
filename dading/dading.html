<script>
// ============================================================
// 全局状态
// ============================================================
let currentDirPath = '';
let currentNiftiPath = '';
window._lastStlDir = ''; // 最近一次生成假体的保存目录
let currentMode = 'nifti';
let volume = null;
let segVolume = null; // 分割结果体积
let shape = null;
let spacing = null;
let activePlane = 'axial';
let cur = { axial: 0, sagittal: 0, coronal: 0 };
let paramPanelExpanded = false; // 参数面板是否已展开

const niftiCanvas = document.getElementById('niftiCanvas');
const niftiCtx = niftiCanvas.getContext('2d');
const sliceSlider = document.getElementById('sliceSlider');
const planeBtns = document.querySelectorAll('.nifti-plane-btn');

// ============================================================
// 加载体积数据（直接从 openNiftiFile 结果接收）
// ============================================================
function loadVolumeData(volData, volShape, volSpacing) {
  volume = new Uint8Array(volData);
  shape = volShape;
  spacing = volSpacing;

  // 启用视角按钮
  planeBtns.forEach(btn => {
    btn.disabled = false;
  });

  cur.axial = Math.floor(shape[2] / 2);
  cur.sagittal = Math.floor(shape[0] / 2);
  cur.coronal = Math.floor(shape[1] / 2);

  switchPlane('axial');
  showStatus(`已加载: ${shape[0]}x${shape[1]}x${shape[2]}, 间距: ${spacing.map(v=>v.toFixed(2)).join('x')}`);
}

// ============================================================
// 加载分割结果叠加层
// ============================================================
async function loadSegmentationOverlay(segNiftiPath) {
  try {
    console.log('加载分割结果:', segNiftiPath);
    const seg = await window.electronapi.readNiftiDirect(segNiftiPath);
    console.log('分割结果元数据:', seg.meta, '原始shape:', shape);
    if (seg.meta.shape[0] === shape[0] && seg.meta.shape[1] === shape[1] && seg.meta.shape[2] === shape[2]) {
      segVolume = new Uint8Array(seg.data);
      renderCurrentSlice();
      showStatus('分割标签已叠加显示');
    } else {
      console.warn('分割结果尺寸不匹配:', seg.meta.shape, 'vs', shape);
      showStatus('分割结果尺寸不匹配，无法叠加');
    }
  } catch (e) {
    console.error('加载分割结果失败:', e);
    showStatus('分割结果加载失败');
  }
}

// ============================================================
// 切换平面（参考 ACL 的 button_plane_clicked）
// ============================================================
function switchPlane(plane) {
  activePlane = plane;
  const maxIdx = getMaxIdx(plane);

  // 更新按钮样式
  planeBtns.forEach(btn => {
    btn.classList.toggle('active', btn.dataset.plane === plane);
  });

  // 重置到中间切片
  cur[plane] = Math.floor(maxIdx / 2);

  // 更新滑块
  sliceSlider.min = 0;
  sliceSlider.max = maxIdx - 1;
  sliceSlider.value = cur[plane];

  renderCurrentSlice();
}

function getMaxIdx(plane) {
  if (plane === 'axial') return shape[2];
  if (plane === 'sagittal') return shape[0];
  return shape[1];
}

// ============================================================
// 渲染当前切片（严格按 ACL show_plane 逻辑）
// nibabel shape=(X,Y,Z), volume[a,b,c] = a*Y*Z + b*Z + c
// ACL: sagittal=data[x,:,:] coronal=data[:,y,:] axial=data[:,:,z]
// ACL后处理: axial=rot90x3+flip, coronal=flip, sagittal=flip
// ============================================================
function renderCurrentSlice() {
  if (!volume || !shape) return;
  niftiCanvas.parentElement.style.background = '#000';
  const plane = activePlane;
  const idx = cur[plane];
  const X = shape[0], Y = shape[1], Z = shape[2];
  const hasSeg = segVolume && segVolume.length === volume.length;

  let w, h;

  if (plane === 'axial') {
    w = Y; h = X;
    niftiCanvas.width = w;
    niftiCanvas.height = h;
    const imgData = niftiCtx.createImageData(w, h);
    const px = imgData.data;
    for (let row = 0; row < h; row++) {
      for (let col = 0; col < w; col++) {
        const vi = col * Y * Z + row * Z + idx;
        const pi = (row * w + col) * 4;
        const g = volume[vi];
        if (hasSeg && segVolume[vi] > 0) {
          const s = segVolume[vi];
          px[pi]   = s === 1 ? Math.floor(g*0.5+102) : Math.floor(g*0.7);
          px[pi+1] = s === 2 ? Math.floor(g*0.5+102) : Math.floor(g*0.7);
          px[pi+2] = Math.floor(g*0.7);
        } else {
          px[pi] = px[pi+1] = px[pi+2] = g;
        }
        px[pi+3] = 255;
      }
    }
    niftiCtx.putImageData(imgData, 0, 0);
  }
  else if (plane === 'coronal') {
    w = X; h = Z;
    niftiCanvas.width = w;
    niftiCanvas.height = h;
    const imgData = niftiCtx.createImageData(w, h);
    const px = imgData.data;
    for (let row = 0; row < h; row++) {
      for (let col = 0; col < w; col++) {
        const vi = col * Y * Z + idx * Z + (Z - 1 - row);
        const pi = (row * w + col) * 4;
        const g = volume[vi];
        if (hasSeg && segVolume[vi] > 0) {
          const s = segVolume[vi];
          px[pi]   = s === 1 ? Math.floor(g*0.5+102) : Math.floor(g*0.7);
          px[pi+1] = s === 2 ? Math.floor(g*0.5+102) : Math.floor(g*0.7);
          px[pi+2] = Math.floor(g*0.7);
        } else {
          px[pi] = px[pi+1] = px[pi+2] = g;
        }
        px[pi+3] = 255;
      }
    }
    niftiCtx.putImageData(imgData, 0, 0);
  }
  else {
    w = Y; h = Z;
    niftiCanvas.width = w;
    niftiCanvas.height = h;
    const imgData = niftiCtx.createImageData(w, h);
    const px = imgData.data;
    for (let row = 0; row < h; row++) {
      for (let col = 0; col < w; col++) {
        const vi = idx * Y * Z + col * Z + (Z - 1 - row);
        const pi = (row * w + col) * 4;
        const g = volume[vi];
        if (hasSeg && segVolume[vi] > 0) {
          const s = segVolume[vi];
          px[pi]   = s === 1 ? Math.floor(g*0.5+102) : Math.floor(g*0.7);
          px[pi+1] = s === 2 ? Math.floor(g*0.5+102) : Math.floor(g*0.7);
          px[pi+2] = Math.floor(g*0.7);
        } else {
          px[pi] = px[pi+1] = px[pi+2] = g;
        }
        px[pi+3] = 255;
      }
    }
    niftiCtx.putImageData(imgData, 0, 0);
  }

  // 按 spacing 校正物理比例，确保显示不变形
  // nibabel spacing=(dx,dy,dz) 对应 shape=(X,Y,Z)
  const sp = spacing || [1, 1, 1];
  let physW, physH;
  if (plane === 'axial')      { physW = w * sp[1]; physH = h * sp[0]; }  // Y*dy vs X*dx
  else if (plane === 'coronal') { physW = w * sp[0]; physH = h * sp[2]; }  // X*dx vs Z*dz
  else                          { physW = w * sp[1]; physH = h * sp[2]; }  // Y*dy vs Z*dz
  const ratio = physW / physH;

  // 先重置 canvas 显示尺寸，确保 wrap.clientWidth/Height 不受 canvas 内容影响
  niftiCanvas.style.width = '0px';
  niftiCanvas.style.height = '0px';
  const wrap = niftiCanvas.parentElement;
  const maxW = wrap.clientWidth || 300;
  const maxH = wrap.clientHeight || 300;
  let dispW, dispH;
  if (maxW / maxH > ratio) {
    dispH = maxH;
    dispW = Math.round(maxH * ratio);
  } else {
    dispW = maxW;
    dispH = Math.round(maxW / ratio);
  }
  console.log(`[resize] plane=${plane} canvas=${w}x${h} spacing=[${sp.map(v=>v.toFixed(2))}] physRatio=${ratio.toFixed(3)} wrap=${maxW}x${maxH} disp=${dispW}x${dispH}`);
  niftiCanvas.style.width = dispW + 'px';
  niftiCanvas.style.height = dispH + 'px';
}

// 底部按钮切换平面
planeBtns.forEach(btn => {
  btn.addEventListener('click', () => switchPlane(btn.dataset.plane));
});

// 滑块
sliceSlider.addEventListener('input', () => {
  cur[activePlane] = parseInt(sliceSlider.value);
  renderCurrentSlice();
});

// 滚轮切片（方向与鼠标一致）
document.getElementById('niftiViewer').addEventListener('wheel', function(e) {
  if (!volume) return;
  e.preventDefault();
  const maxIdx = getMaxIdx(activePlane);
  cur[activePlane] = Math.max(0, Math.min(cur[activePlane] + Math.sign(e.deltaY), maxIdx - 1));
  sliceSlider.value = cur[activePlane];
  renderCurrentSlice();
}, { passive: false });

// ============================================================
// 打开NIfTI（Python读取nii.gz → 写入raw → 前端读取）
// ============================================================
document.getElementById("icon-open-folder").addEventListener("click", async function() {
  try {
    showProgress('加载中...', 0);
    window.electronapi.onConversionProgress(d => updateProgress(d.progress, ''));
    const result = await window.electronapi.openNiftiFile();
    hideProgress();
    if (!result.canceled && result.rawDir) {
      switchToNiftiMode();
      currentDirPath = result.niftiDir;
      currentNiftiPath = result.niftiPath || '';
      // 从 rawDir 读取已转换的体积数据
      const vol = await window.electronapi.readRawVolume(result.rawDir);
      loadVolumeData(vol.data, vol.meta.shape, vol.meta.spacing);
    }
  } catch (e) {
    showStatus('打开失败: ' + e.message);
    hideProgress();
  }
});

// ============================================================
// 模式切换
// ============================================================
const niftiViewer = document.getElementById("niftiViewer");
const vtkContainer = document.getElementById("vtkContainer");

function switchToNiftiMode() {
  currentMode = 'nifti';
}
function switchToVtkMode() {
  currentMode = 'vtk';
  initVtk();
}

// ============================================================
// VTK 3D
// ============================================================
let fullScreenRenderer, renderWindow, renderer, vtkPicker, vtkPointPicker;
function initVtk() {
  if (fullScreenRenderer) return;
  const vtkMain = vtkContainer.querySelector('.vtk-main');
  fullScreenRenderer = vtk.Rendering.Misc.vtkFullScreenRenderWindow.newInstance({ rootContainer: vtkMain, background: [0,0,0] });
  renderWindow = fullScreenRenderer.getRenderWindow();
  renderer = fullScreenRenderer.getRenderer();
  vtkPicker = vtk.Rendering.Core.vtkCellPicker.newInstance();
  vtkPicker.setPickFromList(1); vtkPicker.initializePickList();
  vtkPicker.setTolerance(0.025);
  vtkPointPicker = vtk.Rendering.Core.vtkPointPicker.newInstance();
  vtkPointPicker.setPickFromList(1); vtkPointPicker.initializePickList();
  const c = vtkMain.querySelector('canvas');
  if (c) { c.style.width='100%'; c.style.height='100%'; c.style.display='block'; }
  new ResizeObserver(()=>{if(renderWindow)renderWindow.render();}).observe(vtkMain);
}

function closestPointOnTriangle(p, a, b, c) {
  const ab=[b[0]-a[0],b[1]-a[1],b[2]-a[2]];
  const ac=[c[0]-a[0],c[1]-a[1],c[2]-a[2]];
  const ap=[p[0]-a[0],p[1]-a[1],p[2]-a[2]];
  const d1=ab[0]*ap[0]+ab[1]*ap[1]+ab[2]*ap[2];
  const d2=ac[0]*ap[0]+ac[1]*ap[1]+ac[2]*ap[2];
  if(d1<=0&&d2<=0)return a;
  const bp=[p[0]-b[0],p[1]-b[1],p[2]-b[2]];
  const d3=ab[0]*bp[0]+ab[1]*bp[1]+ab[2]*bp[2];
  const d4=ac[0]*bp[0]+ac[1]*bp[1]+ac[2]*bp[2];
  if(d3>=0&&d4<=d3)return b;
  const vc=d1*d4-d3*d2;
  if(vc<=0&&d1>=0&&d3<=0){const v=d1/(d1-d3);return[a[0]+v*ab[0],a[1]+v*ab[1],a[2]+v*ab[2]];}
  const cp=[p[0]-c[0],p[1]-c[1],p[2]-c[2]];
  const d5=ab[0]*cp[0]+ab[1]*cp[1]+ab[2]*cp[2];
  const d6=ac[0]*cp[0]+ac[1]*cp[1]+ac[2]*cp[2];
  if(d6>=0&&d5<=d6)return c;
  const vb=d5*d2-d1*d6;
  if(vb<=0&&d2>=0&&d6<=0){const w=d2/(d2-d6);return[a[0]+w*ac[0],a[1]+w*ac[1],a[2]+w*ac[2]];}
  const va=d3*d6-d5*d4;
  if(va<=0&&(d4-d3)>=0&&(d5-d6)>=0){const w=(d4-d3)/((d4-d3)+(d5-d6));return[b[0]+w*(c[0]-b[0]),b[1]+w*(c[1]-b[1]),b[2]+w*(c[2]-b[2])];}
  const denom=1.0/(va+vb+vc);const v=vb*denom;const w=vc*denom;
  return[a[0]+ab[0]*v+ac[0]*w,a[1]+ab[1]*v+ac[1]*w,a[2]+ab[2]*v+ac[2]*w];
}

function snapToMeshSurface(point, polyData) {
  if (!polyData || !point) return point;
  const pts = polyData.getPoints();
  const cells = polyData.getPolys();
  if (!pts || !cells) return point;
  const nCells = cells.getNumberOfCells();
  if (nCells === 0) return point;
  let minDist = Infinity;
  let closest = null;
  const cellData = cells.getData();
  let idx = 0;
  for (let i = 0; i < nCells; i++) {
    const nVerts = cellData[idx++];
    if (nVerts < 3) { idx += nVerts; continue; }
    const a = pts.getPoint(cellData[idx]);
    const b = pts.getPoint(cellData[idx+1]);
    const c = pts.getPoint(cellData[idx+2]);
    idx += nVerts;
    const cp = closestPointOnTriangle(point, a, b, c);
    const dx=cp[0]-point[0], dy=cp[1]-point[1], dz=cp[2]-point[2];
    const dist = dx*dx + dy*dy + dz*dz;
    if (dist < minDist) { minDist = dist; closest = cp; }
  }
  return closest || point;
}

function pickWithFallback(screenPos) {
  vtkPicker.pick(screenPos, renderer);
  const cellId = typeof vtkPicker.getCellId === 'function' ? vtkPicker.getCellId() : 'N/A';
  const actors = vtkPicker.getActors();
  const pp = vtkPicker.getPickedPositions();
  console.log('[取点调试] CellPicker cellId:', cellId, 'actors:', actors.length, 'positions:', pp.length, 'hasGetCellId:', typeof vtkPicker.getCellId);
  if (actors.length > 0 && pp.length > 0) {
    for (let i = 0; i < actors.length; i++) {
      const a = actors[i];
      const entry = Object.entries(modelManager.models).find(([,m]) => m.actor === a);
      const isVisible = entry && modelManager.isVisible(entry[0]);
      console.log('[取点调试] CellPicker actor:', entry?entry[0]:'unknown', 'isVisible:', isVisible);
      if (entry && isVisible) {
        return { point: pp[i] || pp[0], actor: a, method: 'CellPicker' };
      }
    }
  }
  console.log('[取点调试] CellPicker未命中可见模型，回退PointPicker');
  vtkPointPicker.pick(screenPos, renderer);
  const pActors = vtkPointPicker.getActors();
  const ppp = vtkPointPicker.getPickedPositions();
  console.log('[取点调试] PointPicker actors:', pActors.length, 'positions:', ppp.length);
  if (pActors.length > 0 && ppp.length > 0) {
    for (let i = 0; i < pActors.length; i++) {
      const a = pActors[i];
      const entry = Object.entries(modelManager.models).find(([,m]) => m.actor === a);
      const isVisible = entry && modelManager.isVisible(entry[0]);
      console.log('[取点调试] PointPicker actor:', entry?entry[0]:'unknown', 'isVisible:', isVisible);
      if (entry && isVisible) {
        return { point: ppp[i] || ppp[0], actor: a, method: 'PointPicker' };
      }
    }
  }
  return { point: null, actor: null, method: 'none' };
}

// ============================================================
// 模型管理器
// ============================================================
class ModelManager {
  constructor() { this.models={}; this.actors={}; this.isLoading=false; }
  async loadModel(name, filePath, visible=true, forceReload=false) {
    if (this.models[name] && !forceReload) { if(visible) this.showModel(name); return this.models[name].actor; }
    // 强制重新加载：先移除旧模型
    if (forceReload && this.models[name]) {
      const old = this.models[name];
      if (old.actor) {
        renderer.removeActor(old.actor);
        try { vtkPicker.removePickList(old.actor); } catch(e) {}
        if (vtkPointPicker) try { vtkPointPicker.removePickList(old.actor); } catch(e) {}
      }
      delete this.models[name];
      delete this.actors[name];
    }
    if (this.isLoading) { showStatus('加载中...'); return null; }
    this.isLoading = true;
    try {
      let buf = window.electronapi ? await window.electronapi.readStlFile(filePath) : await (await fetch(filePath)).arrayBuffer();
      const reader = vtk.IO.Geometry.vtkSTLReader.newInstance(); reader.parseAsArrayBuffer(buf);
      const data = reader.getOutputData();
      const mapper = vtk.Rendering.Core.vtkMapper.newInstance(); mapper.setInputData(data);
      const actor = vtk.Rendering.Core.vtkActor.newInstance(); actor.setMapper(mapper);

// 旋转中心微调工具
// ============================================================
class RotationAdjuster {
  constructor() {
    this.center = null;       // [x,y,z] 旋转中心
    this.isActive = false;    // 是否在选取中心点模式
    this.centerActor = null;  // 标记球体 actor
    this.currentDirPath = ''; // 当前模型目录
    this._keyHandler = null;
    this._clickSub = null;
    this._rotX = 0;           // 累计旋转增量（度）
    this._rotY = 0;
    this._rotZ = 0;
    this._origAngle1 = 0;     // 设置旋转中心时的原始角度
    this._origAngle2 = 0;
  }

  activate() {
    // 清除旧标记
    if (this.centerActor) { renderer.removeActor(this.centerActor); this.centerActor = null; }
    this.center = null;
    this._disableKeyboard();
    document.getElementById("btn-confirm-adjust").disabled = true;
    document.getElementById("btn-save-regenerate").disabled = true;
    this.isActive = true;
    showStatus('请点击3D模型设置旋转中心（右键选点）');
    // 监听右键点击
    if (this._clickSub) { this._clickSub.unsubscribe(); this._clickSub = null; }
    this._clickSub = renderWindow.getInteractor().onRightButtonPress((callData) => {
      if (renderer !== callData.pokedRenderer) return;
      const pos = [callData.position.x, callData.position.y, 0.0];
      // 使用 CellPicker，验证是否命中可见模型的网格面
      vtkPicker.pick(pos, renderer);
      const cellId = typeof vtkPicker.getCellId === 'function' ? vtkPicker.getCellId() : -1;
      if (cellId < 0) return;
      // 检查命中的 actor 是否属于可见模型（忽略隐藏的肱骨等）
      const actors = vtkPicker.getActors();
      let hitVisible = false;
      for (let i = 0; i < actors.length; i++) {
        const entry = Object.entries(modelManager.models).find(([,m]) => m.actor === actors[i]);
        if (entry && modelManager.isVisible(entry[0])) { hitVisible = true; break; }
      }
      if (!hitVisible) return;
      const worldPos = vtkPicker.getPickPosition();
      if (worldPos) {
        this.setCenter(worldPos);
      }
    });
  }

  setCenter(pos) {
    this.center = [pos[0], pos[1], pos[2]];
    this.isActive = false;
    this._rotX = 0; this._rotY = 0; this._rotZ = 0;
    // 使用原始旋转参数（来自 find_nail 搜索），而非显示的几何角度
    this._origAngle1 = window._rawAngle1 !== undefined ? window._rawAngle1 : (parseFloat(document.querySelector('.data-box2').value) || 0);
    this._origAngle2 = window._rawAngle2 !== undefined ? window._rawAngle2 : (parseFloat(document.querySelector('.data-box3').value) || 0);
    console.log('[旋转调整器] 原始旋转参数:', this._origAngle1, this._origAngle2);
    if (this._clickSub) { this._clickSub.unsubscribe(); this._clickSub = null; }
    // 渲染红色标记球
    const sphere = vtk.Filters.Sources.vtkSphereSource.newInstance({ radius: 1.5, thetaResolution: 16, phiResolution: 16 });
    const mapper = vtk.Rendering.Core.vtkMapper.newInstance();
    mapper.setInputData(sphere.getOutputData());
    this.centerActor = vtk.Rendering.Core.vtkActor.newInstance();
    this.centerActor.setMapper(mapper);
    this.centerActor.getProperty().setColor(1, 0.2, 0.2);
    this.centerActor.getProperty().setOpacity(0.8);
    this.centerActor.setPosition(pos[0], pos[1], pos[2]);
    renderer.addActor(this.centerActor);
    renderWindow.render();
    // 启用键盘旋转
    this._enableKeyboard();
    document.getElementById("btn-confirm-adjust").disabled = false;
    document.getElementById("btn-save-regenerate").disabled = false;
    showStatus('旋转中心已设置，用方向键微调角度（可再次点击按钮重新选点）');
  }

  _enableKeyboard() {
    if (this._keyHandler) return;
    this._keyHandler = (e) => {
      if (!this.center || (!modelManager.models['nail1'] && !modelManager.models['nail'])) return;
      const dt = 0.1; // 每步 0.1 度（与 system/VtkClass.py 一致）
      let angleX = 0, angleY = 0, angleZ = 0;
      // ↑↓控制前后倾角（angle1，绕X轴），←→控制左右倾角（angle2，绕Y轴）
      if (e.key === 'ArrowLeft') { angleY = -dt; e.preventDefault(); }
      else if (e.key === 'ArrowRight') { angleY = dt; e.preventDefault(); }
      else if (e.key === 'ArrowUp') { angleX = -dt; e.preventDefault(); }
      else if (e.key === 'ArrowDown') { angleX = dt; e.preventDefault(); }
      else if (e.key === 'x') { angleZ = -dt; e.preventDefault(); }
      else if (e.key === 'c') { angleZ = dt; e.preventDefault(); }
      else if (e.key === 'a') {
        // 重置旋转增量，恢复到原始角度
        const nailModel = modelManager.models['nail1'] || modelManager.models['nail'];
        if (nailModel) { nailModel.actor.setOrientation(0, 0, 0); this._rotX = 0; this._rotY = 0; this._rotZ = 0; renderWindow.render(); this._updateParamsFromNail(); }
        e.preventDefault(); return;
      }
      else return;
      this._rotateNail(angleX, angleY, angleZ);
    };
    document.addEventListener('keydown', this._keyHandler);
  }

  _disableKeyboard() {
    if (this._keyHandler) { document.removeEventListener('keydown', this._keyHandler); this._keyHandler = null; }
  }

  _rotateNail(angleX, angleY, angleZ) {
    const nailModel = modelManager.models['nail1'] || modelManager.models['nail'];
    if (!nailModel) return;
    const actor = nailModel.actor;
    const c = this.center;
    // 设置旋转中心（与 system/VtkClass.py SetOrigin 一致）
    actor.setOrigin(c[0], c[1], c[2]);
    // 累计旋转增量（度）
    this._rotX += angleX;
    this._rotY += angleY;
    this._rotZ += angleZ;
    // 使用 setOrientation 应用累计旋转（与 system SetOrientation 一致）
    actor.setOrientation(this._rotX, this._rotY, this._rotZ);
    renderWindow.render();
    this._updateParamsFromNail();
  }

  _updateParamsFromNail() {
    // 显示当前 VTK 旋转增量（仅供参考，不修改原始角度参数）
    // 微调后的实际角度由 saveAndRegenerate 发送给 Python 重新计算
    const nailModel = modelManager.models['nail1'] || modelManager.models['nail'];
    if (!nailModel || !this.center) return;
    // 显示原始角度 + VTK 增量作为参考值
    const angle1 = (this._origAngle1 + this._rotX).toFixed(2);
    const angle2 = (this._origAngle2 + this._rotY).toFixed(2);
    document.querySelector('.data-box2').value = angle1;
    document.querySelector('.data-box3').value = angle2;
    console.log('[微调显示] 原始:', this._origAngle1.toFixed(2), this._origAngle2.toFixed(2),
                '增量:', this._rotX.toFixed(2), this._rotY.toFixed(2),
                '显示:', angle1, angle2);
  }

  async confirmAndUpdate() {
    if (!this.center) { showStatus('请先设置旋转中心'); return; }
    showStatus('正在计算参数...');
    try {
      const result = await window.electronapi.adjustParameters({
        center: this.center,
        dirPath: this.currentDirPath
      });
      if (result) {
        document.querySelector('.data-box1').value = parseFloat(result.length).toFixed(2);
        document.querySelector('.data-box2').value = parseFloat(result.angle1).toFixed(2);
        document.querySelector('.data-box3').value = parseFloat(result.angle2).toFixed(2);
        // 更新原始旋转参数为当前 VTK 旋转后的值（用于后续微调基准）
        this._origAngle1 = this._origAngle1 + this._rotX;
        this._origAngle2 = this._origAngle2 + this._rotY;
        this._rotX = 0; this._rotY = 0; this._rotZ = 0;
        window._rawAngle1 = this._origAngle1;
        window._rawAngle2 = this._origAngle2;
        console.log('[确认更新] 新原始旋转参数:', this._origAngle1.toFixed(2), this._origAngle2.toFixed(2));
        showStatus('参数已更新');
      }
    } catch(e) { showStatus('计算失败: ' + e.message); }
  }

  async saveAndRegenerate() {
    if (!this.center) { showStatus('请先设置旋转中心'); return; }
    showStatus('正在保存并重新生成...');
    try {
      // 保存旋转后的 nail
      const nailModel = modelManager.models['nail1'] || modelManager.models['nail'];
      if (!nailModel) { showStatus('未找到钉子模型'); return; }
      const mat = nailModel.actor.getMatrix();
      // 发送原始旋转参数 + VTK 增量，让 Python 在原始角度基础上叠加增量
      const params = {
        length: parseFloat(document.querySelector('.data-box1').value) || 0,
        raw_angle1: this._origAngle1 + this._rotX,  // 原始角度 + VTK 增量
        raw_angle2: this._origAngle2 + this._rotY,
        angle1: parseFloat(document.querySelector('.data-box2').value) || 0,  // 显示用
        angle2: parseFloat(document.querySelector('.data-box3').value) || 0,
        dirPath: this.currentDirPath,
        transformMatrix: mat
      };
      console.log('[保存重新生成] 原始角度:', this._origAngle1.toFixed(2), this._origAngle2.toFixed(2));
      console.log('[保存重新生成] VTK增量:', this._rotX.toFixed(2), this._rotY.toFixed(2));
      console.log('[保存重新生成] 发送参数:', params);
      const result = await window.electronapi.regenerateModels(params);
      if (result && result.success) {
        const stlDir = result.dirPath || this.currentDirPath;
        window._lastStlDir = stlDir;
        this.currentDirPath = stlDir;
        // 更新原始旋转参数（来自 Python 重新生成后的 cfg）
        if (result.raw_angle1 !== undefined) window._rawAngle1 = result.raw_angle1;
        if (result.raw_angle2 !== undefined) window._rawAngle2 = result.raw_angle2;
        this.deactivate();
        await pointPicker.autoLoad(stlDir, true);
        showStatus('重新生成完成');
      }
    } catch(e) { showStatus('重新生成失败: ' + e.message); }
  }

  deactivate() {
    this._disableKeyboard();
    this.isActive = false;
    if (this._clickSub) { this._clickSub.unsubscribe(); this._clickSub = null; }
    if (this.centerActor) { renderer.removeActor(this.centerActor); this.centerActor = null; }
    this.center = null;
    this._rotX = 0; this._rotY = 0; this._rotZ = 0;
    this._origAngle1 = 0; this._origAngle2 = 0;
    renderWindow.render();
    document.getElementById("btn-set-center").disabled = false;
    document.getElementById("btn-confirm-adjust").disabled = true;
    document.getElementById("btn-save-regenerate").disabled = true;
  }
}

// ============================================================
// 测距工具
// ============================================================
class MeasureTool {
  constructor() { this.points=[]; this.actors=[]; this.isActive=false; this.sub=null; }
  activate() {
    if (this.isActive) return;
    // 关闭选点工具
    pointPicker.clear();
    document.getElementById("btn-pick-mode").classList.remove("active");
    this.isActive = true; this.points = []; this.clearActors();
    switchToVtkMode();
    this.sub = renderWindow.getInteractor().onRightButtonPress(cd => {
      if (renderer !== cd.pokedRenderer) return;
      const screenPos = [cd.position.x, cd.position.y, 0.0];
      const result = pickWithFallback(screenPos);
      if (!result.point) { showStatus('未命中骨骼'); return; }
      let finalPoint = result.point;
      // 吸附到骨骼表面
      if (result.actor && result.actor.getMapper()) {
        const polyData = result.actor.getMapper().getInputData();
        if (polyData) {
          const snapped = snapToMeshSurface(result.point, polyData);
          const dx=snapped[0]-result.point[0], dy=snapped[1]-result.point[1], dz=snapped[2]-result.point[2];
          if (Math.sqrt(dx*dx+dy*dy+dz*dz) < 50) finalPoint = snapped;
        }
      }
      this.addPoint(finalPoint);
    });
    showStatus('测距模式：右键选2个点');
  }
  addPoint(pt) {
    if (this.points.length >= 2) { this.clearActors(); this.points = []; }
    this.points.push(pt);
    // 绘制端点球
    const src = vtk.Filters.Sources.vtkSphereSource.newInstance();
    src.setCenter(pt); src.setRadius(1.5);
    const m = vtk.Rendering.Core.vtkMapper.newInstance();
    m.setInputData(src.getOutputData());
    const a = vtk.Rendering.Core.vtkActor.newInstance();
    a.setMapper(m); a.getProperty().setColor(1, 1, 0);
    this.actors.push(a); renderer.addActor(a);
    showStatus(`测距：已选 ${this.points.length}/2`);
    if (this.points.length === 2) { this.drawLine(); this.deactivate(); }
    renderWindow.render();
  }
  drawLine() {
    const p0 = this.points[0], p1 = this.points[1];
    // 手动构建 polyData 画线段
    const points = vtk.Common.Core.vtkPoints.newInstance();
    points.setNumberOfPoints(2);
    points.setPoint(0, p0[0], p0[1], p0[2]);
    points.setPoint(1, p1[0], p1[1], p1[2]);
    const lines = vtk.Common.Core.vtkCellArray.newInstance();
    lines.insertNextCell([0, 1]);
    const polyData = vtk.Common.DataModel.vtkPolyData.newInstance();
    polyData.setPoints(points);
    polyData.setLines(lines);
    const lm = vtk.Rendering.Core.vtkMapper.newInstance();
    lm.setInputData(polyData);
    const la = vtk.Rendering.Core.vtkActor.newInstance();
    la.setMapper(lm); la.getProperty().setColor(1, 1, 0); la.getProperty().setLineWidth(2);
    this.actors.push(la); renderer.addActor(la);
    // 计算物理距离（mm）并显示在参数面板
    const dx = p1[0]-p0[0], dy = p1[1]-p0[1], dz = p1[2]-p0[2];
    const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);
    document.querySelector('.data-box-measure').textContent = dist.toFixed(1) + ' mm';
    showStatus(`测距：${dist.toFixed(1)} mm`);
  }
  deactivate() { this.isActive = false; if (this.sub) { this.sub.unsubscribe(); this.sub = null; } }
  clear() { this.deactivate(); this.clearActors(); this.points = [];
    document.querySelector('.data-box-measure').textContent = '';
    renderWindow.render(); showStatus('已清除测距'); }
  clearActors() { this.actors.forEach(a => renderer.removeActor(a)); this.actors = []; }
}
const measureTool = new MeasureTool();

// 供主进程获取当前参数上下文（含 NIfTI 文件路径 + mesh.cfg 植入参数）
window.getAiContextForExternal = async function() {
  const ctx = {};
  const box1 = document.querySelector('.data-box1').value;
  const box2 = document.querySelector('.data-box2').value;
  const box3 = document.querySelector('.data-box3').value;
  if (box1 || box2 || box3) {
    ctx.params = { length: box1, angle1: box2, angle2: box3 };
  }
  if (currentNiftiPath) {
    ctx.nifti_path = currentNiftiPath;
  }
  if (volume && shape) {
    ctx.ct_info = {
      shape: shape,
      spacing: spacing ? spacing.map(v => v.toFixed(2)) : null,
      has_segmentation: !!(segVolume && segVolume.length === volume.length)
    };
  }
  // 读取 mesh.cfg 中的植入参数（圆心、顶点ID、半径、假体目录）
  try {
    let stlDir = window._lastStlDir || currentDirPath;
    if (stlDir && !stlDir.includes('savestl')) {
      const patientId = stlDir.split(/[\\/]/).pop();
      const savestlPath = stlDir.replace(patientId, `savestl/${patientId}`);
      const cfg = await window.electronapi.readConfig(savestlPath);
      if (cfg) stlDir = savestlPath;
    }
    const cfg = await window.electronapi.readConfig(stlDir);
    if (cfg) {
      ctx.implant = {
        center: [parseFloat(cfg.center1), parseFloat(cfg.center2), parseFloat(cfg.center3)],
        vertex_ids: [parseInt(cfg.id1), parseInt(cfg.id2), parseInt(cfg.id3)],
        radius: parseFloat(cfg.r),
        stl_dir: stlDir,
        points: cfg.p1x ? [
          [parseFloat(cfg.p1x), parseFloat(cfg.p1y), parseFloat(cfg.p1z)],
          [parseFloat(cfg.p2x), parseFloat(cfg.p2y), parseFloat(cfg.p2z)],
          [parseFloat(cfg.p3x), parseFloat(cfg.p3y), parseFloat(cfg.p3z)]
        ] : null
      };
    }
  } catch(e) {}
  return ctx;
};
